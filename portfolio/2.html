<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Form Attributes</title>
  </head>
  <body>
    <h1>Student Registration Form</h1>
    <i>
      <form action="submit.html" method="POST">
        <label>Name : </label><br />
        <input type="text" placeholder="Enter your name" /><br /><br />

        <label>Password : </label><br />
        <input type="password" placeholder="Enter your Password" /><br /><br />

        <label>Email : </label><br />
        <input type="email" placeholder="Enter your Email" /><br /><br />

        <label>Phone Number : </label><br />
        <input type="tel" placeholder="Enter your Phone Number" /><br /><br />

        <label>Age :</label><br />
        <input type="date" placeholder="Enter your age" /><br /><br />

        <label>Radio Buttons :</label><br />
        <input type="radio" name="gender" />Male<br />
        <input type="radio" name="gender" />Female<br />
        <input type="radio" name="gender" />Others<br /><br />

        <label>Checkboxes : </label><br />
        <input type="checkbox" name="hobby" />Reading<br />
        <input type="checkbox" name="hobby" />Cooking<br />
        <input type="checkbox" name="hobby" />Travelling<br /><br />

        <label>Upload File</label><br />
        <input type="color" /><br /><br />

        <label>Range b/w numbers</label>
        <input type="range" min="0" max="100" /><br /><br />

        <label>Required Field : </label><br />
        <input type="text" required /><br /><br />

        <label>Dropdown List : </label>
        <select>
          <option value="">Select your country</option>
          <option value="India">India</option>
          <option value="UK">UK</option>
          <option value="Switzerland">Switzerland</option>
          <option value="USA">USA</option>
          <option value="Luxembourg">Luxembourg</option>
          <option value="South Korea">South Korea</option></select
        ><br /><br />

        <input type="submit" value="submit" />
        <button>CLICK ME</button>
        <button type="RESET">RESET</button>
      </form>
    </i>
  </body>
</html>
